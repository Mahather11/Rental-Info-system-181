<symbol id="qr" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h3M20 17v4"/></symbol>

<div class="pb" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
<div class="pb b" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
<div class="app">
 <header class="tbar"><div class="tin">
  <div class="brand"><span class="logo"><svg class="i"><use href="#hom"/></svg></span><span>Find Your Room</span></div>
  <nav id="nav" class="tnav" aria-label="Main"><span class="lt" aria-hidden="true"></span><div class="tb" id="navb"></div></nav>
  <div class="me"><span class="av" style="--h:215">LM</span><span class="mt">Manager</span></div>
 </div></header>
 <main class="main"><div class="vw" id="v-Dashboard">
  <div class="top">
   <div><h1>Good morning, Liza</h1><p class="sub">Sampaguita Dormitory · November 2026</p></div>
   
  </div>
  <div class="bento">
   <section class="card c-occ" aria-label="Occupancy"><h2>Occupancy</h2>
    <div class="donut"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="bg" cx="50" cy="50" r="42"/><circle class="fg" id="ring" cx="50" cy="50" r="42" stroke-dasharray="0 264"/></svg>
    <div><div class="big" id="occ">0%</div><div class="small" id="occT"></div></div></div></section>
   <section class="card c-inc" aria-label="Income"><h2>Collected in November</h2>
    <div class="big" id="inc">₱0</div><div class="small" id="incT"></div>
    <div class="bars" id="bars" role="img" aria-label="Collected income for the last six months"></div></section>
   <section class="card c-q" aria-label="Needs review"><h2>Needs your review <span class="small" id="qc"></span></h2><ul class="q" id="queue"></ul></section>
   <section class="card c-led" aria-label="Rent ledger">
    <div class="lh"><h2>Rent ledger</h2><div class="tools">
     <label class="srch"><svg class="i"><use href="#sea"/></svg><input id="s" type="search" placeholder="Search tenant or room" aria-label="Search tenant or room"><button class="clr" id="clr" type="button" aria-label="Clear search" tabindex="-1"><svg class="i" aria-hidden="true"><use href="#x"/></svg></button></label>
     <div class="tabs" id="tabs"></div></div></div>
    <div id="rows"></div></section>
  </div>
 </div><div class="vw" id="v-Buildings" hidden></div><div class="vw" id="v-Requests" hidden></div><div class="vw" id="v-Payments" hidden></div><div class="vw" id="v-QR-code" hidden></div></main>
</div>
<nav class="bot" id="bot" aria-label="Main"><span class="lt" aria-hidden="true"></span><div id="botb"></div></nav>
<dialog id="dlg" aria-label="Review receipt"><div class="grab" id="grab"><i></i></div><div class="dlg" id="db"></div></dialog>
<div class="toast" id="toast" role="status"></div>
<script src="script.js"></script>
</body>
</html>
